name: CD

on:
  workflow_run:
    workflows: ["CI with Gradle"] # CI 워크플로 이름과 정확히 일치해야 함
    types: [completed] # CI가 끝났을 때 트리거
    branches: ["develop", "main"] # 특정 브랜치에서만

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/medipass

jobs:
  deploy:
    name: Deploy to Server
    # completed는 CI 실패 시에도 트리거되므로 성공한 경우에만 배포한다
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SSH로 서버에 접속해 배포
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # .env 생성 — heredoc(따옴표 처리된 EOF)이라 $, 백틱 등이 있어도 원문 그대로 저장됨
            cat > /home/${{ secrets.SERVER_USER }}/.env << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF

            # CI를 트리거한 커밋의 SHA 태그를 배포 — 어떤 브랜치든 정확히 그 커밋이 배포됨
            IMAGE_TAG=${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}

            echo "[1/3] Pull Docker image ($IMAGE_TAG)..."
            docker pull "$IMAGE_TAG"

            echo "[2/3] Restart container with new image..."
            docker stop medipass || true
            docker rm medipass || true
            docker run -d --name medipass \
              --restart unless-stopped \
              --env-file /home/${{ secrets.SERVER_USER }}/.env \
              -e TZ=Asia/Seoul \
              -p 8080:8080 \
              "$IMAGE_TAG"

            echo "[3/3] Cleanup unused images..."
            docker image prune -f